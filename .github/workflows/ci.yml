name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 11.0.x

      - name: Restore
        run: dotnet restore LondoSpark.Func.slnx

      - name: Build
        run: dotnet build LondoSpark.Func.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --project tests/LondoSpark.Func.Tests/LondoSpark.Func.Tests.csproj --configuration Release --no-build --no-restore

      - name: Verify F# interop
        run: dotnet run --project tests/LondoSpark.Func.FSharp.Compatibility/LondoSpark.Func.FSharp.Compatibility.fsproj --configuration Release --no-build --no-restore

      - name: Pack
        run: |
          dotnet pack src/LondoSpark.Func/LondoSpark.Func.csproj --configuration Release --no-build --no-restore --output "${{ runner.temp }}/packages"
          dotnet pack src/LondoSpark.Func.FSharp/LondoSpark.Func.FSharp.csproj --configuration Release --no-build --no-restore --output "${{ runner.temp }}/packages"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nuget-packages
          path: ${{ runner.temp }}/packages/*.nupkg
          if-no-files-found: error
